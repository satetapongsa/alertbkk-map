<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="120" height="120" rx="28" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar / Circular Wave Background -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.25" stroke-dasharray="4 3"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.35"/>
  <circle cx="60" cy="60" r="16" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

  <!-- Sleek Alert Shield / Pin Symbol -->
  <path d="M60 22 C76 22 84 32 84 46 C84 65 60 92 60 92 C60 92 36 65 36 46 C36 32 44 22 60 22 Z" 
        fill="url(#primaryGradient)" 
        filter="url(#glow)"/>

  <!-- Inner Dark Glass Core -->
  <circle cx="60" cy="46" r="14" fill="#090d16" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>

  <!-- Glowing Incident Pulse Dot -->
  <circle cx="60" cy="46" r="6" fill="url(#accentGradient)" filter="url(#glow)"/>

  <!-- Live Pulse Ping -->
  <circle cx="60" cy="46" r="10" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.8"/>
</svg>
